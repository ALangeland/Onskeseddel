<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMax slice">
  <!-- Original scene: a hooded ranger and a bearded tinkerer camp by a fire, with two motorcycles and a 3D printer. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070f12"/><stop offset=".7" stop-color="#11252a"/><stop offset="1" stop-color="#1a3035"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset=".35" stop-color="#ff7a1a" stop-opacity=".18"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#f3f0de"/><stop offset="1" stop-color="#c9cbb6"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a12"/><stop offset=".6" stop-color="#ffab3d"/><stop offset="1" stop-color="#ffe39a"/></linearGradient>
    <g id="wheel"><circle r="40" fill="#0b1416" stroke="#2c4449" stroke-width="9"/><circle r="26" fill="none" stroke="#3b565c" stroke-width="2"/><circle r="7" fill="#7d969a"/></g>
    <g id="star"><circle r="1.6" fill="#e9f1ee"/></g>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <g opacity=".8">
    <use href="#star" x="90" y="60"/><use href="#star" x="210" y="130"/><use href="#star" x="330" y="40"/><use href="#star" x="470" y="100"/>
    <use href="#star" x="560" y="30"/><use href="#star" x="690" y="140"/><use href="#star" x="760" y="60"/><use href="#star" x="900" y="110"/>
    <use href="#star" x="1010" y="40"/><use href="#star" x="1120" y="150"/><use href="#star" x="1220" y="70"/><use href="#star" x="1500" y="130"/>
    <use href="#star" x="1560" y="50"/><use href="#star" x="40" y="180"/><use href="#star" x="620" y="210"/><use href="#star" x="1290" y="190"/>
  </g>
  <circle cx="1400" cy="96" r="44" fill="url(#moon)"/><circle cx="1418" cy="86" r="8" fill="#b9bca5" opacity=".5"/><circle cx="1388" cy="112" r="5" fill="#b9bca5" opacity=".5"/>

  <!-- mountains -->
  <path d="M0 330 L140 230 L230 290 L380 170 L520 300 L640 240 L760 320 L900 200 L1040 310 L1180 220 L1320 300 L1460 190 L1600 290 V560 H0Z" fill="#132a2f"/>
  <path d="M380 170 L420 200 L400 205 L430 230 L360 190Z M900 200 L935 228 L915 230 L945 255 L880 215Z M1460 190 L1495 220 L1475 222 L1505 248 L1440 205Z" fill="#2a4a50"/>
  <path d="M0 400 Q200 340 420 390 T860 380 T1280 370 T1600 380 V560 H0Z" fill="#0e2024"/>
  <!-- pine trees -->
  <g fill="#0a181b">
    <path d="M60 410 l26 -80 l26 80z M70 370 l16 -60 l16 60z"/><path d="M1530 400 l28 -90 l28 90z M1540 356 l18 -66 l18 66z"/>
    <path d="M1460 410 l20 -60 l20 60z"/><path d="M150 420 l18 -54 l18 54z"/>
  </g>
  <rect y="460" width="1600" height="100" fill="#0a1719"/>
  <rect width="1600" height="560" fill="url(#glow)"/>

  <!-- motorcycle 1: naked bike -->
  <g transform="translate(90 418)">
    <use href="#wheel" x="0" y="44"/><use href="#wheel" x="190" y="44"/>
    <path d="M0 44 L62 4 L120 0 L190 44" fill="none" stroke="#2c4449" stroke-width="8" stroke-linejoin="round"/>
    <path d="M58 -6 Q90 -38 140 -22 L150 6 L70 10Z" fill="#9c3b1d"/>
    <path d="M58 -6 Q90 -38 140 -22" fill="none" stroke="#ff9a3c" stroke-width="2" opacity=".7"/>
    <path d="M140 -18 L196 -14 L200 -2 L146 2Z" fill="#162629"/>
    <path d="M40 -4 L18 -40 M10 -44 L30 -38" stroke="#3b565c" stroke-width="6" stroke-linecap="round"/>
    <rect x="76" y="10" width="46" height="30" rx="6" fill="#1e3236"/>
    <path d="M110 34 Q150 60 214 30" fill="none" stroke="#7d969a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="14" cy="-30" r="9" fill="#ffe39a" opacity=".9"/>
  </g>
  <!-- motorcycle 2: adventure bike, parked further back -->
  <g transform="translate(372 402) scale(.82)">
    <use href="#wheel" x="0" y="50"/><use href="#wheel" x="200" y="50"/>
    <path d="M0 50 L70 -2 L132 -4 L200 50" fill="none" stroke="#2c4449" stroke-width="8"/>
    <path d="M50 -10 L80 -50 L150 -40 L168 -6 L70 4Z" fill="#3c5a5f"/>
    <path d="M80 -50 L60 -86 L36 -80 L50 -10" fill="#2b4246"/>
    <rect x="150" y="-34" width="62" height="40" rx="5" fill="#1b2d31"/>
    <path d="M36 -80 L16 -70" stroke="#3b565c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ranger (original character) -->
  <g transform="translate(640 330)">
    <ellipse cx="20" cy="138" rx="46" ry="8" fill="#000" opacity=".35"/>
    <path d="M-14 40 Q-30 110 -26 136 L66 136 Q70 100 54 40Z" fill="#1f3a33"/>
    <path d="M-14 40 Q20 70 54 40 L46 20 Q20 34 -6 20Z" fill="#284b42"/>
    <path d="M-6 26 Q20 -30 46 26 Q40 6 20 4 Q0 6 -6 26Z" fill="#284b42"/>
    <path d="M2 24 Q20 -4 38 24 Q20 34 2 24Z" fill="#0b1214"/>
    <circle cx="13" cy="20" r="2.4" fill="#ffcf7a"/><circle cx="27" cy="20" r="2.4" fill="#ffcf7a"/>
    <path d="M62 -10 Q100 60 62 130" fill="none" stroke="#8a5a2b" stroke-width="5"/>
    <path d="M62 -10 L62 130" stroke="#d9d2bd" stroke-width="1.2"/>
    <path d="M54 56 L74 60" stroke="#3b2414" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 50 Q-24 30 -10 10 L-2 16 Q-12 34 -4 48Z" fill="#5a3a1e"/>
    <path d="M-12 12 l-3 -12 M-7 12 l0 -12 M-2 14 l3 -11" stroke="#d9d2bd" stroke-width="2"/>
    <path d="M-30 136 Q20 120 70 136" fill="none" stroke="#ff9a3c" stroke-width="2" opacity=".35"/>
  </g>

  <!-- campfire -->
  <g transform="translate(800 470)">
    <path d="M-50 4 L50 -10 M-46 -10 L48 6" stroke="#4a2c16" stroke-width="12" stroke-linecap="round"/>
    <path d="M-30 -4 Q-40 -50 -10 -80 Q-14 -50 4 -40 Q0 -80 22 -110 Q22 -64 40 -44 Q44 -20 30 -4Z" fill="url(#flame)"/>
    <path d="M-12 -6 Q-16 -34 2 -54 Q4 -30 16 -20 Q20 -10 12 -4Z" fill="#fff1c4" opacity=".85"/>
    <circle cx="-36" cy="-120" r="2" fill="#ffab3d"/><circle cx="26" cy="-150" r="1.6" fill="#ffab3d"/><circle cx="8" cy="-175" r="1.3" fill="#ffcf7a"/>
  </g>

  <!-- 3D printer (generic orange-framed bed-slinger) on a crate -->
  <g transform="translate(1060 300)">
    <rect x="-10" y="120" width="230" height="46" rx="4" fill="#3a2717"/>
    <path d="M-10 136 H220 M-10 152 H220" stroke="#2a1b0f" stroke-width="3"/>
    <rect x="10" y="98" width="190" height="22" rx="3" fill="#e8741e"/>
    <rect x="40" y="88" width="130" height="10" fill="#16191a"/>
    <rect x="20" y="-40" width="18" height="140" fill="#e8741e"/><rect x="172" y="-40" width="18" height="140" fill="#e8741e"/>
    <rect x="16" y="-48" width="178" height="14" rx="3" fill="#e8741e"/>
    <rect x="38" y="30" width="134" height="6" fill="#7d969a"/>
    <rect x="86" y="14" width="34" height="38" rx="4" fill="#16191a"/>
    <rect x="90" y="18" width="10" height="10" fill="#ff9a3c" opacity=".8"/>
    <path d="M103 52 l0 10" stroke="#c9cbb6" stroke-width="3"/>
    <path d="M90 88 L96 66 L110 66 L116 88Z" fill="#46b39a"/>
    <path d="M96 66 L103 58 L110 66" fill="#46b39a"/>
    <rect x="-6" y="70" width="30" height="22" rx="3" fill="#16191a"/><rect x="-2" y="74" width="20" height="10" fill="#3fd0a6" opacity=".8"/>
    <circle cx="105" cy="-74" r="26" fill="#1c2b2e" stroke="#46b39a" stroke-width="10"/><circle cx="105" cy="-74" r="6" fill="#7d969a"/>
    <path d="M105 -48 Q128 -20 104 14" fill="none" stroke="#46b39a" stroke-width="2"/>
  </g>

  <!-- tinkerer (original bearded character with goggles and wrench) -->
  <g transform="translate(1320 370)">
    <ellipse cx="30" cy="96" rx="52" ry="8" fill="#000" opacity=".35"/>
    <rect x="0" y="40" width="60" height="56" rx="16" fill="#5a3a1e"/>
    <rect x="4" y="80" width="20" height="16" rx="4" fill="#2a1b0f"/><rect x="36" y="80" width="20" height="16" rx="4" fill="#2a1b0f"/>
    <rect x="2" y="56" width="56" height="8" fill="#2a1b0f"/><rect x="24" y="55" width="12" height="10" rx="2" fill="#d6a23c"/>
    <circle cx="30" cy="18" r="22" fill="#e0b48c"/>
    <path d="M8 22 Q30 92 52 22 Q44 34 30 32 Q16 34 8 22Z" fill="#b5532a"/>
    <path d="M18 34 Q30 42 42 34" fill="none" stroke="#7a3216" stroke-width="2"/>
    <path d="M6 10 Q30 -24 54 10 Z" fill="#6d7f82"/>
    <rect x="10" y="4" width="40" height="8" rx="4" fill="#16191a"/>
    <circle cx="20" cy="8" r="7" fill="#3fd0a6" stroke="#16191a" stroke-width="3"/><circle cx="40" cy="8" r="7" fill="#3fd0a6" stroke="#16191a" stroke-width="3"/>
    <circle cx="30" cy="22" r="4" fill="#c98f66"/>
    <path d="M60 56 L94 22" stroke="#7d969a" stroke-width="7" stroke-linecap="round"/>
    <path d="M88 14 a10 10 0 1 0 14 14 l-6 -6 l-4 4 l-4 -4 l4 -4z" fill="#7d969a"/>
    <path d="M0 56 Q-14 70 -6 86" fill="none" stroke="#5a3a1e" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
